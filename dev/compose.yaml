# Local dev dependencies only. Bound to 127.0.0.1, so nothing outside this machine can reach them.
name: garden

services:
  postgres:
    labels:
      ao.session: ${AO_SESSION_ID:-manual}
    image: ${GARDEN_DEV_POSTGRES_IMAGE:-garden-postgres:local}
    environment:
      POSTGRES_USER: garden
      POSTGRES_PASSWORD: garden-dev
      POSTGRES_DB: garden
    ports:
      - "127.0.0.1:${GARDEN_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garden -d garden"]
      interval: 2s
      timeout: 3s
      retries: 30

  oidc:
    labels:
      ao.session: ${AO_SESSION_ID:-manual}
    # Fake identity provider for local sign-in. The backend refuses it outside dev.
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./oidc/config.json:/config/config.json:ro
      - ./oidc/login.html:/config/login.html:ro
    ports:
      - "127.0.0.1:${GARDEN_DEV_OIDC_PORT:-55081}:8080"

  embedding:
    labels:
      ao.session: ${AO_SESSION_ID:-manual}
    # Local bge-m3 embeddings for the knowledge module. Opt in with `just embedding-up`, which needs `just models` first.
    profiles: ["embedding"]
    image: ${GARDEN_LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    command: ["--model", "/models/bge-m3-Q8_0.gguf", "--embedding", "--pooling", "mean", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "8192"]
    volumes:
      - ../var/models:/models:ro
    ports:
      - "127.0.0.1:${GARDEN_DEV_EMBEDDING_PORT:-55083}:8080"

volumes:
  pgdata:
