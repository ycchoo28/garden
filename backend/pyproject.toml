[project]
name = "garden-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.3",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "procrastinate==3.10.0",
    "python-multipart==0.0.32",
    "uuid6==2025.0.1",
    "pyjwt==2.15.0",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "pgvector==0.4.2",
    "pypdf==6.21.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
    "pyright==1.1.414",
    "import-linter==2.15",
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["app", "migrations"]

[tool.pytest.ini_options]
testpaths = ["app", "tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core modules never import business modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "Shared plumbing imports neither core nor business modules"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = ["app.core", "app.modules"]
