name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No model keys and no network services beyond the local Compose stack are needed.
env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: extractions/setup-just@v3
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location -O "$base/$archive"
          curl --fail --silent --show-error --location -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Set up
        run: just setup
      - name: Install Chromium for the browser tests
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Check
        # Keep listeners below Linux's ephemeral client-port range during API startup.
        env:
          GARDEN_E2E_API_URL: http://127.0.0.1:15000
          GARDEN_E2E_WEB_URL: http://localhost:15173
          GARDEN_E2E_EMBEDDING_URL: http://127.0.0.1:15084
        run: just check

  eval-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: extractions/setup-just@v3
      - name: Set up
        run: just setup
      - name: Install Chromium for the scripted browser evals
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Run scripted reference evals
        run: just agent-eval --reference --fake-embedding --junitxml dist/evals/junit.xml
      - name: Publish JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-junit
          path: agent/dist/evals/junit.xml
          if-no-files-found: error

  scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: extractions/setup-just@v3
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location -O "$base/$archive"
          curl --fail --silent --show-error --location -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Set up
        run: just setup
      - name: Generate a throwaway module with the scaffold
        run: just new-module ciproof
      - name: Install Chromium for the browser tests
        run: cd frontend && bunx playwright install --with-deps chromium
      - name: Prove guardrails reject planted violations and permit valid code
        run: just guardrail-test
      - name: Check the generated module
        # Keep listeners below Linux's ephemeral client-port range during API startup.
        env:
          GARDEN_E2E_API_URL: http://127.0.0.1:15000
          GARDEN_E2E_WEB_URL: http://localhost:15173
          GARDEN_E2E_EMBEDDING_URL: http://127.0.0.1:15084
        run: just check
